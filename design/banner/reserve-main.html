<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1200px;height:630px;overflow:hidden;
    font-family:"Noto Sans JP","Noto Sans CJK JP",sans-serif;color:#000}
  .b{width:1200px;height:630px;display:grid;grid-template-columns:640px 560px;background:#e8f5e9}
  .l{padding:56px 44px 56px 60px;display:flex;flex-direction:column;justify-content:center;gap:0}
  .brand{display:flex;align-items:center;gap:12px}
  .brand img{width:44px;height:44px;display:block}
  .brand span{font-size:17px;font-weight:700;line-height:1.3;letter-spacing:.01em}
  h1{margin-top:34px;font-size:60px;font-weight:700;line-height:1.18;letter-spacing:-.01em}
  h1 em{font-style:normal;color:#1a7c32}
  p{margin-top:22px;font-size:21px;font-weight:500;line-height:1.6;color:#2c3a31}
  .chips{margin-top:36px;display:flex;gap:11px}
  .chips li{list-style:none;background:#fff;border:1.5px solid #bcdcc2;border-radius:999px;
    padding:10px 22px;font-size:19px;font-weight:700;color:#1a7c32}
  .r{position:relative;overflow:hidden}
  .r img{width:100%;height:100%;object-fit:cover;object-position:22% 22%;display:block}
  .r::after{content:"";position:absolute;inset:0;width:120px;
    background:linear-gradient(90deg,#e8f5e9 0%,rgba(232,245,233,0) 100%)}
</style></head><body>
<div class="b">
  <div class="l">
    <div class="brand">
      <img src="../../assets/images/LOGO.png" alt="">
      <span>一般社団法人<br>訪問販売適正化推進協会</span>
    </div>
    <h1>説明会の<br><em>ご予約</em></h1>
    <p>第三者相談窓口の仕組みを、<br>45分でご説明します。</p>
    <ul class="chips">
      <li>オンライン</li><li>45分</li><li>参加費無料</li>
    </ul>
  </div>
  <div class="r"><img src="../../assets/images/hero-main.jpg" alt=""></div>
</div>
</body></html>
